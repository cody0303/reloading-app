services:
  reloading-app:
    image: ghcr.io/cody0303/reloading-app:v59
    container_name: reloading-app
    ports:
      - "5002:5000"
    volumes:
      - reloading-app-data:/data
    environment:
      - DB_PATH=/data/reloading.db
    restart: unless-stopped

volumes:
  reloading-app-data:
    external: true
