name: Release Tarball

on:
  push:
    tags:
      - 'v[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      IMAGE: ghcr.io/cody0303/reloading-app

    steps:
      - uses: actions/checkout@v5

      # Same tests as ci.yml, run in this job (no extra job to bill) so a failing tag publishes nothing
      - name: Run tests
        run: |
          python3 tests/test_backend.py
          node tests/frontend.test.js

      - name: Extract version number
        id: ver
        run: echo "num=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build tarball
        run: |
          tar -cf reloading-app_${{ steps.ver.outputs.num }}.tar \
            app.py sm_decode.py requirements.txt Dockerfile \
            docker-compose.yml static/
          sha256sum reloading-app_${{ steps.ver.outputs.num }}.tar | tee sha256.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "reloading-app v${{ steps.ver.outputs.num }}"
          body_path: sha256.txt
          files: reloading-app_${{ steps.ver.outputs.num }}.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=v${{ steps.ver.outputs.num }}
          tags: |
            ${{ env.IMAGE }}:v${{ steps.ver.outputs.num }}
            ${{ env.IMAGE }}:latest

      - name: Pin new version on the deploy branch
        run: |
          sed "s|\(image: ${IMAGE}:\).*|\1v${{ steps.ver.outputs.num }}|" \
            docker-compose.portainer.yml > "$RUNNER_TEMP/compose.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git fetch origin deploy
            git checkout -f -B deploy origin/deploy
          else
            git checkout --orphan deploy
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/compose.yml" docker-compose.portainer.yml
          git add docker-compose.portainer.yml
          git commit -m "Deploy v${{ steps.ver.outputs.num }}" || echo "nothing to commit"
          git push origin deploy
