name: Release Tarball

on:
  push:
    tags:
      - 'v[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      IMAGE: ghcr.io/cody0303/reloading-app

    steps:
      - uses: actions/checkout@v4

      - name: Extract version number
        id: ver
        run: echo "num=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build tarball
        run: |
          tar -cf reloading-app_${{ steps.ver.outputs.num }}.tar \
            app.py sm_decode.py requirements.txt Dockerfile \
            docker-compose.yml nginx.conf static/
          sha256sum reloading-app_${{ steps.ver.outputs.num }}.tar | tee sha256.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "reloading-app v${{ steps.ver.outputs.num }}"
          body_path: sha256.txt
          files: reloading-app_${{ steps.ver.outputs.num }}.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=v${{ steps.ver.outputs.num }}
          tags: |
            ${{ env.IMAGE }}:v${{ steps.ver.outputs.num }}
            ${{ env.IMAGE }}:latest

      - name: Pin new version in Portainer compose file
        run: |
          git fetch origin main
          git checkout main
          sed -i "s|\(image: ${IMAGE}:\).*|\1v${{ steps.ver.outputs.num }}|" docker-compose.portainer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.portainer.yml
          git commit -m "Deploy v${{ steps.ver.outputs.num }}" || echo "nothing to commit"
          git push origin main
